name: ci

# Те же проверки, что агент гоняет перед PR: сборка, типы, рендер всех превью, витрина одной страницей.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build · typecheck · previews
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Рендер превью
        run: npm run check
        env:
          CHROMIUM: google-chrome
      - name: Версия и CHANGELOG
        run: node scripts/check-version.mjs
      - run: npm run pack:page
      - name: Скриншоты превью и витрина
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: previews-${{ github.sha }}
          path: |
            out/shots/
            out/vitrina.html
          retention-days: 14
