<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Stack — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var H = window.Hireminds, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(H.Stack,{gap:6},
      h(H.Stack,{gap:2},
        h(H.H1,{size:'section'},'Операции'),
        h(H.Lead,{tone:'mute'},'Запуски агентов по задачам проекта: фаза, состояние, история.')),
      h(H.Stack,{gap:3},
        h(H.SectionHeader,{count:0},'Запуски'),
        h(H.EmptyState,{variant:'mini'},'Запусков нет')))
  );
</script>
</body>
</html>
