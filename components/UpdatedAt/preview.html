<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>UpdatedAt — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var H = window.Hireminds, h = React.createElement;
  function Demo() {
    var t = React.useState(Date.now() - 5000), busy = React.useState(false);
    function refresh() { busy[1](true); setTimeout(function () { busy[1](false); t[1](Date.now()); }, 600); }
    return h(H.Stack,{gap:3},
      h(H.Cluster,{gap:3},
        h(H.UpdatedAt,{updatedAt:t[0],loading:busy[0]}),
        h(H.Button,{variant:'secondary',size:'sm',loading:busy[0],onClick:refresh},'Обновить')),
      h(H.Cluster,{gap:5},
        h(H.UpdatedAt,{updatedAt:Date.now() - 3 * 60e3}),
        h(H.UpdatedAt,{updatedAt:Date.now(),loading:true})));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
