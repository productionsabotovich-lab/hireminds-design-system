<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<body>
<div id="root"></div>
<script>
  var H = window.Hireminds, h = React.createElement;
  var DIFFS = {
    "apps/web/src/members/MemberMenu.tsx": [{ oldStart: 14, newStart: 14, context: "export function MemberMenu({ member, viewer }: MemberMenuProps) {", lines: [
      "   const { openRoleDialog } = useRoleDialog(member);",
      "   const confirmRemove = useConfirmRemove(member);",
      "   const items: MenuItem[] = [];",
      "-  items.push({ id: \"change-role\", label: \"Сменить роль\", onSelect: openRoleDialog });",

      "+    items.push({ id: \"change-role\", label: \"Сменить роль\", onSelect: openRoleDialog });",
      "+  }",

      "+  if (member.id === viewer.id) items.push({ id: \"leave\", label: \"Покинуть проект\", onSelect: leave });",

      " ",
    ] }],
    "apps/web/src/members/MembersTable.tsx": [{ oldStart: 41, newStart: 41, context: "function MemberRow({ member, viewer }: RowProps) {", lines: [

</html>
