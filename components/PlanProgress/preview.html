<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>PlanProgress — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .pv-col { display: flex; flex-direction: column; gap: 14px; max-width: 420px; }
  .pv-box { display: flex; flex-direction: column; gap: 6px; }
  .pv-cap { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var H = window.Hireminds, h = React.createElement;
  var box = function (cap, el) { return h('div', { className: 'pv-box' }, h('span', { className: 'pv-cap' }, cap), el); };
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'pv-col' },
      box('6 пунктов', h(H.PlanProgress, { done: 3, total: 6 })),
      box('длинный план, 26 пунктов — та же сплошная полоса', h(H.PlanProgress, { done: 11, total: 26 })),
      box('без подписи — число в заголовке плана', h(H.PlanProgress, { done: 4, total: 9, label: '' })),
      box('плана ещё нет', h(H.PlanProgress, { done: null })))
  );
</script>
</body>
</html>
