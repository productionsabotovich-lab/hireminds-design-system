<html lang="ru">
<head>

<title>IconArrow — preview</title>

<div id="root"></div>
<script>
  var H = window.Hireminds, h = React.createElement, F = React.Fragment;

    h('div',{className:'pv-row',style:{gap:18,color:'var(--ink-2)'}},
    h(H.IconArrow,{size:16}),
    h(H.IconArrow,{direction:'left',size:16}),
    h(H.IconArrow,{variant:'chevron',size:16}),
    h(H.IconArrow,{variant:'chevron',direction:'down',size:16}),
    h(H.IconArrow,{variant:'send',size:16}))
  );
