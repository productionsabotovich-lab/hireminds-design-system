<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AgentStatus — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .pv-grid { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 20px 24px; }
  .pv-box { display: flex; flex-direction: column; gap: 6px; width: 320px; max-width: 100%; min-width: 0; }
  .pv-cap { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
  /* место под открытый попап очереди: он поверх страницы, высота виджета не меняется */
  .pv-pop { padding-bottom: 210px; }
  [role="tooltip"] { transition: none !important; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var H = window.Hireminds, h = React.createElement;
  var pm = { role: 'PM', runner: 'Claude Code', model: 'Sonnet 5.5', connection: 'раннер на VPS' };
  var dev = { role: 'Developer', runner: 'Claude Code', model: 'Sonnet 5.5' };
  var queue = [
    { key: 'PIL-15', title: 'Роли участников проекта: owner, admin и viewer', current: true, priority: 'high', href: '#' },
    { key: 'PIL-22', title: 'Экспорт отчёта QA в PDF', waited: '2 ч', priority: 'urgent', href: '#' },
    { key: 'PIL-31', title: 'Лимит возвратов на доработку', waited: '1 д', priority: 'medium', href: '#' }
  ];
  var working = { kind: 'working', task: { key: 'PIL-15', title: 'Роли участников проекта: owner, admin и viewer', href: '#', phase: 'Code', plan: { done: 3, total: 7 } } };
  var A = function (cap, p, cls) { return h('div', { className: 'pv-box' + (cls ? ' ' + cls : '') }, h('span', { className: 'pv-cap' }, cap), h(H.AgentStatus, Object.assign({ agentHref: '#' }, p))); };
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'pv-grid' },
      A('working · задача в работе, очередь', { agent: pm, state: working, queue: queue }),
      A('free · только «Свободен» и модель', { agent: dev, state: { kind: 'free' } }),
      A('error · лимит, восстановится, команда', { agent: dev, state: { kind: 'error', title: 'Лимит Claude Code исчерпан', until: '18:00', fix: { text: 'Или переключите модель:', cmd: 'hm agent model Developer opus' } }, queue: queue.slice(1) }),
      A('paused', { agent: pm, state: { kind: 'paused', since: '14:20', by: 'Антон Саботович' }, queue: queue.slice(1) }),
      A('off · раннер не подключён', { agent: { role: 'QA', runner: 'Claude Code', model: 'Sonnet 5.5' }, state: { kind: 'off', fix: { text: 'Подключите раннер:', cmd: 'hm runner connect QA' } } }),
      A('очередь открыта · попап поверх, 360–480px', { agent: pm, state: working, queue: queue, queueOpen: true }, 'pv-pop')
    )
  );
</script>
</body>
</html>
