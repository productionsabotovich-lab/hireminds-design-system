<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Body — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .pv-col { display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var H = window.Hireminds, h = React.createElement, F = React.Fragment;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div',{className:'pv-col',style:{gap:6,maxWidth:440}},
    h(H.Body,{tone:'ink'},'ink — ключ хранится зашифрованным и не покидает ваш workspace.'),
    h(H.Body,{tone:'ink-3'},'ink-3 — вторичное описание внутри плашки.'),
    h(H.Body,{},'mute (по умолчанию) — подпись под блоком настроек.'),
    h(H.Body,{size:'small'},'small — последнее использование 2 часа назад.'))
  );
</script>
</body>
</html>
