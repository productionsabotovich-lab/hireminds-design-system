<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Pill — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .pv-col { display: flex; flex-direction: column; gap: 12px; }
  .pv-cap { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
  .pv-tr { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--mute); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var H = window.Hireminds, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div',{className:'pv-col'},
    h('div',{className:'pv-row'},
      h(H.Pill,{tone:'accent',dot:true,pulse:true},'В работе'),
      h(H.Pill,{tone:'accent'},'Утверждено'),
      h(H.Pill,{tone:'warn',dot:true},'Ждёт решения'),
      h(H.Pill,{tone:'warn',dot:true,pulse:true},'Ждёт решения · пульс'),
      h(H.Pill,{tone:'danger',dot:true,pulse:true},'Повтор · пульс'),
      h(H.Pill,{tone:'danger',dot:true},'Ошибка'),
      h(H.Pill,{tone:'dim'},'Остановлено'),
      h(H.Pill,{tone:'ink'},'Review')),
    h('span',{className:'pv-cap'},'ink — название фазы в строке перехода журнала'),
    h('div',{className:'pv-tr'},h(H.Pill,{tone:'dim'},'Code'),'→',h(H.Pill,{tone:'ink'},'Review'),'возврат после проверки QA'),
    h('div',{className:'pv-row'},
      h(H.Pill,{tone:'accent',size:'md',dot:true},'Workspace ready'),
      h(H.Pill,{tone:'dim',size:'md'},'Скоро')))
  );
</script>
</body>
</html>
