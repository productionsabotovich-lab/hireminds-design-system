<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Select — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .pv-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 24px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var H = window.Hireminds, h = React.createElement;
  var opts = [{value:'hireminds',label:'hireminds'},{value:'busina',label:'busina'},{value:'freelance-bot',label:'freelance-bot'}];
  function Demo() {
    var st = React.useState('hireminds');
    return h('div',{className:'pv-row'},
      h(H.Select,{id:'p1',label:'Проект',options:opts,value:st[0],onChange:st[1]}),
      h(H.Select,{id:'p2',label:'Проект',size:'sm',inlineLabel:true,options:opts,value:st[0],onChange:st[1]}),
      h(H.Select,{id:'p3',label:'Модель',options:opts,placeholder:'Выберите модель',disabled:true}));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
