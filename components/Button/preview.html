<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Button — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .pv-col { display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var H = window.Hireminds, h = React.createElement, F = React.Fragment;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div',{className:'pv-col'},
    h('div',{className:'pv-row'},
      h(H.Button,{variant:'primary'},'Сохранить'),
      h(H.Button,{variant:'secondary'},'Отмена'),
      h(H.Button,{variant:'ghost'},'Подробнее'),
      h(H.Button,{variant:'danger'},'Удалить workspace')),
    h('div',{className:'pv-row'},
      h(H.Button,{size:'sm',variant:'secondary'},'sm · 28px'),
      h(H.Button,{size:'md'},'md · 34px'),
      h(H.Button,{size:'lg'},'lg · 40px'),
      h(H.Button,{loading:true},'Сохраняем…'),
      h(H.Button,{disabled:true,variant:'secondary'},'Недоступно')))
  );
</script>
</body>
</html>
