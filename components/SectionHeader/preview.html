<body>
<div id="root"></div>
<script>
  var H = window.Hireminds, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(H.Stack,{gap:5},
      h(H.SectionHeader,{count:15},'События'),
      h(H.SectionHeader,null,'Фазы'),
      h(H.SectionHeader,{count:5,action:h(H.ExternalLink,{href:'#',variant:'action'},'Открыть в Web UI Temporal')},'Запуски'))
  );
</script>
