<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Dot — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .pv-col { display: flex; flex-direction: column; gap: 12px; }
  .pv-cap { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
  /* ячейка с overflow: hidden и строка с многоточием — ореол точки не должен обрезаться */
  .pv-cell { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: var(--space-2); width: 260px; overflow: hidden; padding: 0; border: 1px dashed var(--line-2); }
  .pv-ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; color: var(--ink-2); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var H = window.Hireminds, h = React.createElement, F = React.Fragment;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div',{className:'pv-col'},
    h('div',{className:'pv-row',style:{gap:18}},
    h(H.Dot,{variant:'status',tone:'accent',size:'md'}),
    h(H.Dot,{variant:'status',tone:'warn',size:'md'}),
    h(H.Dot,{variant:'status',tone:'danger',size:'md'}),
    h(H.Dot,{variant:'presence',tone:'accent',size:'sm',pulse:true}),
    h('span',{className:'pv-row',style:{gap:6,color:'var(--mute)',fontSize:12}},'Анна',h(H.Dot,{}),'Senior dev',h(H.Dot,{}),'online')),
    h('span',{className:'pv-cap'},'Ячейка overflow: hidden и строка с многоточием — ореол целиком, до подписи space-2'),
    h('div',{className:'pv-cell'},h(H.Dot,{variant:'status',tone:'warn',size:'md'}),h('span',{className:'pv-ell'},'D-46 Утверждение плана кампании запуска для первых команд')),
    h('div',{className:'pv-cell'},h(H.Dot,{variant:'status',tone:'accent',size:'md'}),h('span',{className:'pv-ell'},'D-34 Объём согласован')),
    h('div',{className:'pv-cell'},h(H.Dot,{variant:'status',tone:'danger',size:'sm'}),h('span',{className:'pv-ell'},'S-121 Developer остановлен: лимит подписки')))
  );
</script>
</body>
</html>
