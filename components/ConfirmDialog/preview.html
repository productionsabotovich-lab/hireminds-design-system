<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ConfirmDialog — preview</title>
<style>
  body { margin: 0; padding: 16px; min-height: 240px; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var H = window.Hireminds, h = React.createElement;
  function Demo() {
    var st = React.useState(true);
    return h('div',null,
      h(H.Button,{variant:'secondary',onClick:function(){st[1](true)}},'Отменить'),
      h(H.ConfirmDialog,{open:st[0],tone:'danger',title:'Отменить запуск?',confirmLabel:'Отменить',cancelLabel:'Назад',
        onConfirm:function(){st[1](false)},onCancel:function(){st[1](false)}},'Статус issue в трекере не изменится.'));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
