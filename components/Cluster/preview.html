<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Cluster — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var H = window.Hireminds, h = React.createElement;
  var t0 = Date.now() - 4000;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(H.Stack,{gap:5},
      h(H.Cluster,{justify:'between',align:'end',gap:4},
        h(H.H1,{size:'section'},'Операции'),
        h(H.Cluster,{gap:3},
          h(H.UpdatedAt,{updatedAt:t0}),
          h(H.Button,{variant:'secondary',size:'sm'},'Обновить'))),
      h(H.Cluster,{gap:2},
        h(H.Pill,{tone:'danger',dot:true},'Блокер'),
        h(H.Pill,{tone:'dim'},'Круг 1')))
  );
</script>
</body>
</html>
