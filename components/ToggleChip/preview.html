<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ToggleChip — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .pv-col { display: flex; flex-direction: column; gap: 14px; }
  .pv-box { display: flex; flex-direction: column; gap: 6px; }
  .pv-cap { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
  .pv-bar { display: flex; align-items: center; justify-content: space-between; max-width: 560px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .pv-h { font-size: 12.5px; font-weight: 600; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var H = window.Hireminds, h = React.createElement;
  function Demo(p) {
    var st = React.useState(p.on), on = st[0];
    return h('div', { className: 'pv-bar' }, h('span', { className: 'pv-h' }, 'Ход работы'),
      h(H.ToggleChip, { label: 'Подробно', pressed: on, onChange: st[1], hint: 'Показать вызовы инструментов и вывод' }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'pv-col' },
      h('div', { className: 'pv-box' }, h('span', { className: 'pv-cap' }, 'выключен · над лентой «Хода работы»'), h(Demo, { on: false })),
      h('div', { className: 'pv-box' }, h('span', { className: 'pv-cap' }, 'включён'), h(Demo, { on: true })))
  );
</script>
</body>
</html>
