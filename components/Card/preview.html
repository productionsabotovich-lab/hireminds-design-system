<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Card — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .pv-col { display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var H = window.Hireminds, h = React.createElement, F = React.Fragment;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div',{style:{maxWidth:440}},
    h(H.Card,{header:'Ключ API',footer:h(F,null,h(H.Button,{},'Сохранить'),h(H.Button,{variant:'ghost'},'Отмена'))},
      h('div',{className:'pv-col'},
        h(H.Body,{},'Агенты используют этот ключ для всех запросов к модели.'),
        h(H.Input,{id:'k',font:'mono',label:'Ключ Anthropic',placeholder:'sk-ant-api03-…'}))))
  );
</script>
</body>
</html>
