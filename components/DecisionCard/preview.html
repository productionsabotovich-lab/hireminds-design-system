<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DecisionCard — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .pv-col { display: flex; flex-direction: column; gap: 18px; max-width: 640px; }
  .pv-box { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .pv-narrow { max-width: 343px; }
  .pv-cap { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var H = window.Hireminds, h = React.createElement;
  var card = function () { return h(H.DecisionCard, { id: 'D-44', gate: 'Лимит возвратов исчерпан', line: 'Ждёт Антона Саботовича 23 ч 45 мин · напоминание в треде Linear', onOpen: function () {} }); };
  var box = function (cap, cls, el) { return h('div', { className: 'pv-box ' + cls }, h('span', { className: 'pv-cap' }, cap), el); };
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'pv-col' },
      box('карточка задачи · ждёт решения', '', card()),
      box('375 px', 'pv-narrow', card()))
  );
</script>
</body>
</html>
