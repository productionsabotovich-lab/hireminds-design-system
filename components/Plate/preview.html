<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Plate — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .pv-col { display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var H = window.Hireminds, h = React.createElement, F = React.Fragment;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div',{className:'pv-col',style:{maxWidth:380,gap:8}},
    h(H.Plate,{variant:'success'},'Email подтверждён. Теперь можно войти.'),
    h(H.Plate,{variant:'warning'},'Без ключа Anthropic агенты не смогут начать работу.'),
    h(H.Plate,{variant:'error'},'Ссылка устарела. Запросите новую.'),
    h(H.Plate,{variant:'info'},'Ключ хранится зашифрованным и не покидает workspace.'))
  );
</script>
</body>
</html>
