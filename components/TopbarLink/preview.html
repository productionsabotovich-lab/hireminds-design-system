<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TopbarLink — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .pv-col { display: flex; flex-direction: column; gap: 10px; }
  .pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
  .pv-cap { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
  .pv-narrow { max-width: 343px; }
  /* состояния в статичном превью — те же значения, что у :hover и :focus-visible */
  .pv-hover a { border-color: var(--line-2); color: var(--ink); }
  .pv-focus a { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* превью шире 600px: длинная подпись; «375 px» — короткая, как на экране до 600px */
  .pv-wide a > span:nth-child(2) { display: inline !important; }
  .pv-wide a > span:nth-child(3) { display: none !important; }
  .pv-narrow a > span:nth-child(2) { display: none; }
  .pv-narrow a > span:nth-child(3) { display: inline; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var H = window.Hireminds, h = React.createElement;
  var dec = function (v, extra) { return h(H.TopbarLink, Object.assign({ href: '#', label: 'Мои решения', shortLabel: 'Решения', icon: 'inbox', tone: 'attention', badge: { kind: 'count', value: v } }, extra || {})); };
  var count = function (v) { return h(H.TopbarLink, { href: '#', label: 'Мои решения', shortLabel: 'Решения', icon: 'inbox', badge: { kind: 'count', value: v } }); };
  var files = h(H.TopbarLink, { label: 'Файлы', badge: { kind: 'soon' } });
  var me = h(H.UserAvatar, { name: 'Антон Саботович', size: 'sm', shape: 'circle' });
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'pv-col' },
      h('span', { className: 'pv-cap' }, 'шапка: «Файлы» скоро · есть неоткрытые решения — точка пульсирует'),
      h('div', { className: 'pv-row pv-wide' }, files, dec(4, { unseen: 2 }), me),
      h('span', { className: 'pv-cap' }, 'attention: все открыты — без пульса · ноль — ни точки, ни числа · текущая страница'),
      h('div', { className: 'pv-row pv-wide' }, dec(3), dec(0), dec(3, { current: true })),
      h('span', { className: 'pv-cap' }, 'default: счётчик плашкой · наведение · фокус'),
      h('div', { className: 'pv-row pv-wide' }, count(4), count(0), h('span', { className: 'pv-hover' }, dec(4)), h('span', { className: 'pv-focus' }, dec(4))),
      h('span', { className: 'pv-cap' }, '375 px · состав тот же, короткая подпись'),
      h('div', { className: 'pv-row pv-narrow' }, files, dec(4, { unseen: 1 }), me))
  );
</script>
</body>
</html>
