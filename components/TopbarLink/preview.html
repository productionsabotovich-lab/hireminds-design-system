<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TopbarLink — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .pv-col { display: flex; flex-direction: column; gap: 10px; }
  .pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
  .pv-cap { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
  .pv-narrow { max-width: 343px; }
  /* состояния в статичном превью — те же значения, что у :hover и :focus-visible */
  .pv-hover a { border-color: var(--line-2); color: var(--ink); }
  .pv-focus a { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* превью уже 720px: ссылки soon показаны, как в широкой шапке */
  .pv-wide [aria-disabled] { display: inline-flex !important; }
  .pv-wide a > span:nth-child(2) { display: inline !important; }
  .pv-wide a > span:nth-child(3) { display: none !important; }
  /* «375 px»: soon скрыты, короткая подпись — как на экране до 600px */
  .pv-narrow [aria-disabled] { display: none; }
  .pv-narrow a > span:nth-child(2) { display: none; }
  .pv-narrow a > span:nth-child(3) { display: inline; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var H = window.Hireminds, h = React.createElement;
  var dec = function (v, extra) { return h(H.TopbarLink, Object.assign({ href: '#', label: 'Мои решения', shortLabel: 'Решения', icon: 'inbox', badge: { kind: 'count', value: v } }, extra || {})); };
  var team = h(H.TopbarLink, { label: 'Моя команда', badge: { kind: 'soon' } });
  var log = h(H.TopbarLink, { label: 'Журнал', badge: { kind: 'soon' } });
  var me = h(H.UserAvatar, { name: 'Антон Саботович', size: 'sm', shape: 'circle' });
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'pv-col' },
      h('span', { className: 'pv-cap' }, 'Шапка: soon · есть решения'),
      h('div', { className: 'pv-row pv-wide' }, team, log, dec(4), me),
      h('span', { className: 'pv-cap' }, 'Нет решений · много · текущая страница'),
      h('div', { className: 'pv-row pv-wide' }, dec(0), dec(128), dec(4, { current: true })),
      h('span', { className: 'pv-cap' }, 'Наведение · фокус'),
      h('div', { className: 'pv-row pv-wide' }, h('span', { className: 'pv-hover' }, dec(4)), h('span', { className: 'pv-focus' }, dec(4))),
      h('span', { className: 'pv-cap' }, '375 px · «Моя команда» и «Журнал» скрыты'),
      h('div', { className: 'pv-row pv-narrow' }, team, log, dec(4), me))
  );
</script>
</body>
</html>
