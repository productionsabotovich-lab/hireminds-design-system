<!-- @dsCard group="Data" height=900 -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ListRow — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .pv-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 300px)); gap: 16px 24px; align-items: start; }
  .pv-col { display: flex; flex-direction: column; gap: 8px; }
  .pv-narrow { max-width: 343px; }
  .pv-cap { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
  /* состояния в статичном превью — те же значения, что у :hover и :focus-visible */
  .pv-hover a { background: var(--inset); }
  .pv-focus a { box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 2.5px var(--accent-soft); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var H = window.Hireminds, h = React.createElement;
  var anton = h(H.UserAvatar, { name: 'Антон Саботович', size: 'xs', shape: 'circle' });
  var role = function (n) { return h(H.UserAvatar, { name: n, size: 'xs' }); };
  var row = function (p, k) { return h(H.ListRow, Object.assign({ key: k }, p)); };
  var dWait = { href: '#', lead: anton, title: 'Лимит кругов', code: 'D-44', trailing: h(H.Pill, { tone: 'warn', dot: true }, 'ждёт'), sub: 'Антон Саботович · ждёт 1 д 2 ч' };
  var dDone = { href: '#', lead: anton, title: 'Объём согласован', code: 'D-21', trailing: h(H.Pill, { tone: 'accent' }, 'утверждено'), sub: 'Антон Саботович · кнопка в треде · 22 окт' };
  var dStop = { href: '#', lead: anton, title: 'Приёмка', code: 'D-30', trailing: h(H.Pill, null, 'остановлено'), sub: 'Антон Саботович · страница решения · 19 окт' };
  var sRun = { href: '#', lead: role('Developer'), title: 'Developer', code: 'S-118', trailing: h(H.Pill, { dot: true, pulse: true }, 'идёт'), sub: 'Code · после возврата · 24 мин' };
  var sDone = { href: '#', lead: role('Reviewer'), title: 'Reviewer', code: 'S-119', trailing: h(H.Pill, null, 'завершена'), sub: 'Review · 18 мин' };
  var sErr = { href: '#', lead: role('QA'), title: 'QA', code: 'S-121', trailing: h(H.Pill, { tone: 'danger', dot: true }, 'ошибка'), sub: 'остановлен · лимит подписки' };
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'pv-grid' },
      h('div', { className: 'pv-col' }, h('span', { className: 'pv-cap' }, 'Решения'),
        h(H.Card, { header: 'Решения' }, row(dWait, 1), row(dDone, 2), row(dStop, 3))),
      h('div', { className: 'pv-col' }, h('span', { className: 'pv-cap' }, 'Сессии ролей'),
        h(H.Card, { header: 'Сессии ролей' }, row(sRun, 1), row(sDone, 2), row(sErr, 3))),
      h('div', { className: 'pv-col' }, h('span', { className: 'pv-cap' }, 'Наведение · фокус · без ссылки'),
        h(H.Card, null,
          h('div', { className: 'pv-hover' }, row(dWait, 1)),
          h('div', { className: 'pv-focus' }, row(sRun, 2)),
          row(Object.assign({}, dDone, { href: undefined, sub: 'решение видно, перехода нет' }), 3))),
      h('div', { className: 'pv-col' }, h('span', { className: 'pv-cap' }, 'Пусто'),
        h(H.Card, { header: 'Решения' }, h(H.EmptyState, { variant: 'mini' }, 'Решений пока нет'))),
      h('div', { className: 'pv-col pv-narrow' }, h('span', { className: 'pv-cap' }, '375 px'),
        h(H.Card, null, row(Object.assign({}, dWait, { title: 'Лимит кругов после третьего возврата' }), 1), row(sErr, 2))))
  );
</script>
</body>
</html>
